<script>
(function() {
  try {
    var params = new URLSearchParams(window.location.search);
    var pid = params.get('playerId') || localStorage.getItem('litegames_player_id');
    if (pid) {
      ['litegames_player_id','aviator_player_id','shamo_keno_player_id','shamo_rocket_player_id','mh5_player_id','jetx_player_id','dragons_player_id'].forEach(function(k) {
        localStorage.setItem(k, pid);
      });
    }
    var pname = params.get('displayName') || localStorage.getItem('litegames_player_name');
    if (pname) {
      ['litegames_player_name','shamo_keno_name','shamo_rocket_name','jetx_display_name'].forEach(function(k) {
        localStorage.setItem(k, pname);
      });
    }
    if (window.parent && window.parent !== window) {
      var origFetch = window.fetch;
      window.fetch = function() {
        var reqUrl = typeof arguments[0] === 'string' ? arguments[0] : (arguments[0] && arguments[0].url || '');
        return origFetch.apply(this, arguments).then(function(res) {
          try {
            var u = reqUrl;
            if (u.indexOf('/api/') !== -1) {
              setTimeout(function() {
                window.parent.postMessage({ type: 'LITEGAMES_SYNC_WALLET' }, '*');
              }, 120);
            }
          } catch(_) {}
          return res;
        });
      };
    } else {
      window.addEventListener('DOMContentLoaded', function() {
        var btn = document.createElement('a');
        btn.href = '/';
        btn.innerHTML = '&#8592; Lite Games';
        btn.style.cssText = 'position:fixed;bottom:14px;left:14px;z-index:99999;background:rgba(15,20,35,0.88);color:#38bdf8;border:1px solid rgba(56,189,248,0.45);padding:6px 12px;border-radius:999px;font-family:sans-serif;font-size:12px;font-weight:700;text-decoration:none;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,0.45);';
        document.body.appendChild(btn);
      });
    }
  } catch (e) {}
})();
</script>

<script>
    // ==========================================
    // 1. 888 DRAGONS SLOT AUDIO SYNTHESIZER
    // ==========================================
    class DragonsAudio {
        constructor() {
            this.ctx = null;
            this.soundOn = localStorage.getItem('dragons_sound') !== 'false';
        }
        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            return Boolean(this.ctx);
        }
        tone(freq, type, dur, vol = 0.08, slide = null, delay = 0) {
            if (!this.soundOn || !this.init() || !this.ctx) return;
            try {
                const t = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(vol, t + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                osc.connect(g);
                g.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + dur + 0.02);
            } catch (_) {}
        }
        playSpinStart() {
            this.tone(240, 'triangle', 0.08, 0.08, 420);
        }
        playSpinTick() {
            this.tone(580, 'sine', 0.025, 0.025);
        }
        playReelStop(idx) {
            const freqs = [180, 210, 250];
            this.tone(freqs[idx] || 200, 'triangle', 0.09, 0.11, 110);
        }
        playWin(mult) {
            const notes = mult >= 50
                ? [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98]
                : [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((hz, i) => this.tone(hz, 'triangle', 0.22, 0.12, null, i * 0.075));
        }
    }
    const slotAudio = new DragonsAudio();

    // ==========================================
    // 2. PLAYER STATE & SETTINGS
    // ==========================================
    function getPlayerId() {
        const tg = window.Telegram?.WebApp?.initDataUnsafe?.user;
        if (tg && tg.id) return String(tg.id);
        let pid = localStorage.getItem('dragons_player_id');
        if (!pid) {
            pid = 'dragon_' + Math.random().toString(36).slice(2, 10);
            localStorage.setItem('dragons_player_id', pid);
        }
        return pid;
    }
    const playerId = getPlayerId();

    let credit = 1000.00;
    let bet = 5.00;
    let isSpinning = false;
    let turboSpin = localStorage.getItem('dragons_turbo') === 'true';
    let skipScreens = localStorage.getItem('dragons_skip') !== 'false';
    let autoSpinsRemaining = 0;
    let spinHistory = [];
    let biggestWin = { user: 'dragon_king', win: 10000 };

    const REEL_SYMBOLS = ['🐉', '🐲', '🇨', '🥈', ''];
    const BET_OPTIONS = [1, 2, 5, 10, 25, 50, 100];

    function updateDisplay() {
        document.getElementById('creditDisplay').innerText = `ETB ${credit.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        document.getElementById('betDisplay').innerText = `ETB ${bet.toFixed(2)}`;
        document.getElementById('payRed').innerText = `ETB ${(bet * 100).toFixed(2)}`;
        document.getElementById('payGreen').innerText = `ETB ${(bet * 50).toFixed(2)}`;
        document.getElementById('payBlue').innerText = `ETB ${(bet * 25).toFixed(2)}`;
        document.getElementById('payAny').innerText = `ETB ${(bet * 5).toFixed(2)}`;

        const autoBtn = document.getElementById('autoPlayBtn');
        if (autoSpinsRemaining > 0) {
            autoBtn.classList.add('auto-active');
            autoBtn.innerText = String(autoSpinsRemaining);
        } else {
            autoBtn.classList.remove('auto-active');
            autoBtn.innerText = '▶▶';
        }
        document.getElementById('quickSoundBtn').innerText = slotAudio.soundOn ? '🔊' : '🔇';
    }

    async function loadInitialState() {
        try {
            const res = await fetch(`/api/dragons/state?playerId=${encodeURIComponent(playerId)}&bet=${bet}`);
            const data = await res.json();
            if (data.status === 'success') {
                credit = Number(data.credit ?? credit);
                if (Array.isArray(data.history)) spinHistory = data.history;
                if (data.biggestWin) biggestWin = data.biggestWin;
                updateDisplay();
            }
        } catch (_) {}
    }

    async function addBonusCredit() {
        try {
            const res = await fetch('/api/dragons/bonus', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playerId, amount: 500 })
            });
            const data = await res.json();
            if (data.status === 'success') {
                credit = Number(data.credit);
                slotAudio.playWin(5);
                updateDisplay();
            }
        } catch (_) {}
    }

    function toggleQuickSound() {
        slotAudio.soundOn = !slotAudio.soundOn;
        localStorage.setItem('dragons_sound', String(slotAudio.soundOn));
        updateDisplay();
    }

    // ==========================================
    // 3. SERVER-AUTHORITATIVE REEL SPIN & STAGGERED STOP
    // ==========================================
    async function spinReels() {
        if (isSpinning) return;

        if (credit < bet) {
            autoSpinsRemaining = 0;
            updateDisplay();
            showInsufficientFundsModal();
            return;
        }

        isSpinning = true;
        slotAudio.playSpinStart();

        document.getElementById('spinBtn').classList.add('spinning');
        document.getElementById('msgOverlay').style.display = 'none';
        document.getElementById('paylineMiddle').classList.remove('winning');

        const reelCols = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3')
        ];
        reelCols.forEach((col) => {
            col.classList.add('spinning');
            col.children[1].classList.remove('win-hit');
        });

        // Visual rolling effect while requesting outcome from backend
        const rolling = [true, true, true];
        const rollInterval = setInterval(() => {
            let playedTick = false;
            reelCols.forEach((col, idx) => {
                if (!rolling[idx]) return;
                for (let row = 0; row < 3; row++) {
                    col.children[row].innerText = REEL_SYMBOLS[Math.floor(Math.random() * REEL_SYMBOLS.length)];
                }
                if (!playedTick) {
                    slotAudio.playSpinTick();
                    playedTick = true;
                }
            });
        }, turboSpin ? 45 : 70);

        let spinResult = null;
        try {
            const res = await fetch('/api/dragons/spin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playerId, bet })
            });
            spinResult = await res.json();
        } catch (_) {
            spinResult = null;
        }

        if (!spinResult || spinResult.status !== 'success') {
            clearInterval(rollInterval);
            reelCols.forEach((c) => c.classList.remove('spinning'));
            document.getElementById('spinBtn').classList.remove('spinning');
            isSpinning = false;
            autoSpinsRemaining = 0;
            if (typeof spinResult?.credit === 'number') credit = spinResult.credit;
            updateDisplay();
            if (spinResult?.code === 'INSUFFICIENT_FUNDS') {
                showInsufficientFundsModal();
            }
            return;
        }

        // Staggered reel stops (left -> middle -> right)
        const baseWait = turboSpin ? 180 : 420;
        const stepWait = turboSpin ? 110 : 240;

        const stopReel = (idx) => new Promise((resolve) => {
            setTimeout(() => {
                rolling[idx] = false;
                const col = reelCols[idx];
                col.classList.remove('spinning');
                for (let r = 0; r < 3; r++) {
                    col.children[r].innerText = spinResult.reels[idx][r] || '';
                }
                slotAudio.playReelStop(idx);
                resolve();
            }, baseWait + idx * stepWait);
        });

        await Promise.all([stopReel(0), stopReel(1), stopReel(2)]);
        clearInterval(rollInterval);

        credit = Number(spinResult.credit);
        if (Array.isArray(spinResult.history)) spinHistory = spinResult.history;

        if (spinResult.winAmount > 0) {
            document.getElementById('paylineMiddle').classList.add('winning');
            reelCols.forEach((col) => col.children[1].classList.add('win-hit'));
            const msg = document.getElementById('msgOverlay');
            msg.innerHTML = `WIN ETB ${Number(spinResult.winAmount).toFixed(2)}!<small>${spinResult.winLabel} (${spinResult.multiplier}x)</small>`;
            msg.style.display = 'block';
            slotAudio.playWin(spinResult.multiplier);
        }

        document.getElementById('spinBtn').classList.remove('spinning');
        isSpinning = false;

        if (autoSpinsRemaining > 0) {
            autoSpinsRemaining -= 1;
            updateDisplay();
            if (autoSpinsRemaining > 0 && credit >= bet) {
                const nextDelay = spinResult.winAmount > 0 ? (skipScreens ? 650 : 1200) : (turboSpin ? 250 : 500);
                setTimeout(() => {
                    if (autoSpinsRemaining > 0 && !isSpinning) spinReels();
                }, nextDelay);
                return;
            } else {
                autoSpinsRemaining = 0;
            }
        }
        updateDisplay();
    }

    // Spacebar spin convenience
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.getElementById('modalBg').style.display !== 'flex') {
            e.preventDefault();
            spinReels();
        }
    });

    // ==========================================
    // 4. MODALS (INSUFFICIENT, RULES, SETTINGS, BET, AUTOPLAY, HISTORY)
    // ==========================================
    function openModal(title, htmlBody, okLabel = 'OK', onOk = null) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = htmlBody;
        const okBtn = document.getElementById('modalOkBtn');
        okBtn.innerText = okLabel;
        okBtn.onclick = onOk || closeModal;
        document.getElementById('modalBg').style.display = 'flex';
    }

    function showInsufficientFundsModal() {
        openModal(
            'MESSAGE',
            'Insufficient funds to place this bet. Tap <b>ADD +500 ETB</b> below or lower your bet level.',
            'ADD +500 ETB',
            async () => {
                await addBonusCredit();
                closeModal();
            }
        );
    }

    function openRules() {
        openModal(
            'GAME RULES & PAYTABLE',
            `All symbols pay from left to right on adjacent reels on the single center payline.<br><br>
            • 🐉 × 3 (Red Dragon): <b>100x</b> (ETB ${(bet * 100).toFixed(2)})<br>
            • 🐲 × 3 (Green Dragon): <b>50x</b> (ETB ${(bet * 50).toFixed(2)})<br>
            • 🇨 × 3 (Blue Dragon): <b>25x</b> (ETB ${(bet * 25).toFixed(2)})<br>
            • 🥈 / Any 3 Dragons: <b>5x</b> (ETB ${(bet * 5).toFixed(2)})<br><br>
            Theoretical RTP: <b>96.84%</b>`
        );
    }

    function openSettings() {
        openModal(
            'SYSTEM SETTINGS',
            `<div class="setting-row"><span>Sound Effects</span><button class="toggle-pill ${slotAudio.soundOn ? 'on' : ''}" onclick="toggleQuickSound(); openSettings();">${slotAudio.soundOn ? 'ON' : 'OFF'}</button></div>
             <div class="setting-row"><span>Turbo Spin</span><button class="toggle-pill ${turboSpin ? 'on' : ''}" onclick="turboSpin=!turboSpin; localStorage.setItem('dragons_turbo', String(turboSpin)); openSettings();">${turboSpin ? 'ON' : 'OFF'}</button></div>
             <div class="setting-row"><span>Fast Win Screen</span><button class="toggle-pill ${skipScreens ? 'on' : ''}" onclick="skipScreens=!skipScreens; localStorage.setItem('dragons_skip', String(skipScreens)); openSettings();">${skipScreens ? 'ON' : 'OFF'}</button></div>`
        );
    }

    function openBetSettings() {
        if (isSpinning) return;
        const buttons = BET_OPTIONS.map((v) =>
            `<button class="bet-chip-btn ${bet === v ? 'selected' : ''}" onclick="changeBet(${v})">ETB ${v}</button>`
        ).join('');
        openModal(
            'BET SETTINGS',
            `<div>Current Total Bet: <b style="color:#ffcc00;">ETB ${bet.toFixed(2)}</b></div><div class="bet-grid">${buttons}</div>`
        );
    }

    function changeBet(val) {
        bet = Number(val);
        updateDisplay();
        closeModal();
    }

    function handleAutoPlayBtn() {
        if (autoSpinsRemaining > 0) {
            autoSpinsRemaining = 0;
            updateDisplay();
            return;
        }
        openModal(
            'AUTOPLAY SETTINGS',
            `<div>Select number of autospins: <b id="autoCountLabel" style="color:#ffcc00;">25</b></div>
             <input id="autoSlider" type="range" min="5" max="100" step="5" value="25" oninput="document.getElementById('autoCountLabel').innerText=this.value" style="width:100%; margin:14px 0; accent-color:#ffcc00;">
             <div style="font-size:11px; color:#b8860b;">Tap ▶▶ anytime to stop autoplay early.</div>`,
            'START AUTOPLAY',
            () => {
                const n = Number(document.getElementById('autoSlider').value) || 25;
                autoSpinsRemaining = n;
                closeModal();
                updateDisplay();
                spinReels();
            }
        );
    }

    function openHistoryModal() {
        const rows = spinHistory.length
            ? spinHistory.slice(0, 15).map((h) => `
                <div style="display:flex; justify-content:space-between; padding:6px 8px; border-bottom:1px solid rgba(184,134,11,0.2); font-size:11px;">
                    <span style="color:#aaa;">${h.time}</span>
                    <span>${(h.middleRow || []).map((s) => s || '—').join(' ')}</span>
                    <span>Bet ${Number(h.bet).toFixed(0)}</span>
                    <span style="font-weight:bold; color:${h.win > 0 ? '#00e676' : '#ff5252'};">${h.win > 0 ? '+' + Number(h.win).toFixed(2) : '0.00'}</span>
                </div>
            `).join('')
            : '<div style="text-align:center; padding:16px; color:#aaa;">No spins yet. Press ↻ to spin!</div>';

        openModal(
            'SPIN HISTORY',
            `<div style="margin-bottom:8px; font-size:11px; color:#ffcc00; text-align:center;">🏆 Biggest Win: <b>${biggestWin.user}</b> (ETB ${Number(biggestWin.win).toLocaleString('en-US', { minimumFractionDigits: 2 })})</div>${rows}`
        );
    }

    function closeModal() {
        document.getElementById('modalBg').style.display = 'none';
    }

    updateDisplay();
    loadInitialState();
</script>
</body>
</html>
