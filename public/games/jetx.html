<!-- LITEGAMES_PLAYER_SYNC -->
<script>
(function() {
  try {
    var params = new URLSearchParams(window.location.search);
    var pid = params.get('playerId') || localStorage.getItem('litegames_player_id');
    if (pid) {
      ['litegames_player_id','aviator_player_id','shamo_keno_player_id','shamo_rocket_player_id','mh5_player_id','jetx_player_id','dragons_player_id'].forEach(function(k) {
        localStorage.setItem(k, pid);
      });
    }
    var pname = params.get('displayName') || localStorage.getItem('litegames_player_name');
    if (pname) {
      ['litegames_player_name','shamo_keno_name','shamo_rocket_name','jetx_display_name'].forEach(function(k) {
        localStorage.setItem(k, pname);
      });
    }
    if (window.parent && window.parent !== window) {
      var origFetch = window.fetch;
      window.fetch = function() {
        var reqUrl = typeof arguments[0] === 'string' ? arguments[0] : (arguments[0] && arguments[0].url || '');
        return origFetch.apply(this, arguments).then(function(res) {
          try {
            var u = reqUrl;
            if (u.indexOf('/api/') !== -1) {
              setTimeout(function() {
                window.parent.postMessage({ type: 'LITEGAMES_SYNC_WALLET' }, '*');
              }, 120);
            }
          } catch(_) {}
          return res;
        });
      };
    } else {
      window.addEventListener('DOMContentLoaded', function() {
        var btn = document.createElement('a');
        btn.href = '/';
        btn.innerHTML = '&#8592; Lite Games';
        btn.style.cssText = 'position:fixed;bottom:14px;left:14px;z-index:99999;background:rgba(15,20,35,0.88);color:#38bdf8;border:1px solid rgba(56,189,248,0.45);padding:6px 12px;border-radius:999px;font-family:sans-serif;font-size:12px;font-weight:700;text-decoration:none;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,0.45);';
        document.body.appendChild(btn);
      });
    }
  } catch (e) {}
})();
</script>

<script>
    // ==========================================
    // 1. JETX AUDIO ENGINE (JET THRUST, EXPLOSION, SFX)
    // ==========================================
    class JetXAudio {
        constructor() {
            this.ctx = null;
            this.sfxGain = null;
            this.noiseBuffer = null;
            this.enabled = localStorage.getItem('jetx_sound') !== 'false';
            this.flyingNodes = null;
            this.isFlying = false;
        }
        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return false;
                this.ctx = new AudioCtx();
                this.sfxGain = this.ctx.createGain();
                this.sfxGain.gain.value = this.enabled ? 0.9 : 0;
                this.sfxGain.connect(this.ctx.destination);

                const sr = this.ctx.sampleRate;
                const buf = this.ctx.createBuffer(1, sr * 2, sr);
                const d = buf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                this.noiseBuffer = buf;
            }
            if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            return true;
        }
        unlock() {
            this.init();
            if (this.enabled && gameState === 'FLYING' && !this.isFlying && this.ctx && this.ctx.state === 'running') {
                this.startFlight(currentMultiplier);
            }
        }
        toggle() {
            this.enabled = !this.enabled;
            localStorage.setItem('jetx_sound', String(this.enabled));
            if (this.sfxGain && this.ctx) {
                this.sfxGain.gain.setTargetAtTime(this.enabled ? 0.9 : 0, this.ctx.currentTime, 0.03);
            }
            if (!this.enabled) {
                this.stopFlight();
            } else {
                this.unlock();
                if (gameState === 'FLYING') this.startFlight(currentMultiplier);
            }
            return this.enabled;
        }
        tone(freq, type, dur, vol = 0.08, slide = null, delay = 0) {
            if (!this.enabled || !this.init() || !this.ctx) return;
            try {
                const t = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(vol, t + 0.012);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                osc.connect(g);
                g.connect(this.sfxGain);
                osc.start(t);
                osc.stop(t + dur + 0.02);
            } catch (_) {}
        }
        playBet() { this.unlock(); this.tone(520, 'triangle', 0.08, 0.1, 780); }
        playCancel() { this.unlock(); this.tone(420, 'sine', 0.1, 0.08, 240); }
        playCashout() {
            this.unlock();
            this.tone(587.33, 'triangle', 0.1, 0.12, null, 0);
            this.tone(880.00, 'triangle', 0.18, 0.13, null, 0.07);
            this.tone(1174.66, 'sine', 0.22, 0.11, null, 0.14);
        }
        startFlight(mult = 1.0) {
            if (!this.enabled || this.isFlying || !this.init() || !this.ctx || this.ctx.state !== 'running') return;
            try {
                const now = this.ctx.currentTime;
                const bus = this.ctx.createGain();
                bus.gain.setValueAtTime(0.001, now);
                bus.gain.linearRampToValueAtTime(0.12, now + 0.25);
                bus.connect(this.sfxGain);

                const jetOsc = this.ctx.createOscillator();
                jetOsc.type = 'sawtooth';
                jetOsc.frequency.setValueAtTime(75, now);

                const jetFilter = this.ctx.createBiquadFilter();
                jetFilter.type = 'lowpass';
                jetFilter.frequency.setValueAtTime(420, now);

                const rush = this.ctx.createBufferSource();
                rush.buffer = this.noiseBuffer;
                rush.loop = true;

                const rushFilter = this.ctx.createBiquadFilter();
                rushFilter.type = 'bandpass';
                rushFilter.frequency.setValueAtTime(750, now);

                const rushGain = this.ctx.createGain();
                rushGain.gain.value = 0.25;

                jetOsc.connect(jetFilter);
                jetFilter.connect(bus);
                rush.connect(rushFilter);
                rushFilter.connect(rushGain);
                rushGain.connect(bus);

                jetOsc.start(now);
                rush.start(now);
                this.flyingNodes = { bus, jetOsc, jetFilter, rush, rushFilter };
                this.isFlying = true;
                this.updateFlight(mult);
            } catch (_) {}
        }
        updateFlight(mult = 1.0) {
            if (!this.isFlying || !this.flyingNodes || !this.ctx) return;
            const norm = Math.min(1, Math.log10(Math.max(1, mult)) / Math.log10(20));
            const now = this.ctx.currentTime;
            this.flyingNodes.jetOsc.frequency.setTargetAtTime(75 + norm * 90, now, 0.08);
            this.flyingNodes.jetFilter.frequency.setTargetAtTime(420 + norm * 900, now, 0.08);
            this.flyingNodes.rushFilter.frequency.setTargetAtTime(750 + norm * 1200, now, 0.08);
        }
        stopFlight() {
            if (!this.flyingNodes || !this.ctx) {
                this.isFlying = false;
                this.flyingNodes = null;
                return;
            }
            const n = this.flyingNodes;
            this.flyingNodes = null;
            this.isFlying = false;
            try {
                const now = this.ctx.currentTime;
                n.bus.gain.setTargetAtTime(0.0001, now, 0.04);
                setTimeout(() => {
                    try { n.jetOsc.stop(); } catch (_) {}
                    try { n.rush.stop(); } catch (_) {}
                    try { n.bus.disconnect(); } catch (_) {}
                }, 120);
            } catch (_) {}
        }
        playExplosion() {
            this.stopFlight();
            if (!this.enabled || !this.init() || !this.ctx || this.ctx.state !== 'running') return;
            try {
                const now = this.ctx.currentTime;
                const sub = this.ctx.createOscillator();
                const subG = this.ctx.createGain();
                sub.type = 'sine';
                sub.frequency.setValueAtTime(140, now);
                sub.frequency.exponentialRampToValueAtTime(32, now + 0.48);
                subG.gain.setValueAtTime(0.32, now);
                subG.gain.exponentialRampToValueAtTime(0.0001, now + 0.52);
                sub.connect(subG);
                subG.connect(this.sfxGain);
                sub.start(now);
                sub.stop(now + 0.55);

                const boom = this.ctx.createBufferSource();
                boom.buffer = this.noiseBuffer;
                const f = this.ctx.createBiquadFilter();
                f.type = 'lowpass';
                f.frequency.setValueAtTime(1800, now);
                f.frequency.exponentialRampToValueAtTime(140, now + 0.55);
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.28, now);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
                boom.connect(f);
                f.connect(g);
                g.connect(this.sfxGain);
                boom.start(now);
                boom.stop(now + 0.62);
            } catch (_) {}
        }
    }

    // ==========================================
    // 3. UI UPDATES & BET PANELS
    // ==========================================
    function updateUI() {
        document.getElementById('userBalance').innerText = balance.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + ' ETB';

        for (let i = 1; i <= 2; i++) {
            const btn = document.getElementById(`betBtn${i}`);
            const input = document.getElementById(`betInput${i}`);
            const val = parseFloat(input.value) || 20;

            btn.style.background = '';
            btn.style.color = '';

            if (bets[i].queued) {
                btn.className = 'bet-btn cancel';
                btn.innerText = 'Cancel (Next)';
                input.disabled = true;
            } else if (gameState === 'WAITING') {
                if (bets[i].active) {
                    btn.className = 'bet-btn cancel';
                    btn.innerText = 'Cancel';
                    input.disabled = true;
                } else {
                    btn.className = 'bet-btn';
                    btn.innerText = `Bet ${val.toFixed(2)} ETB`;
                    input.disabled = false;
                }
            } else if (gameState === 'FLYING') {
                if (bets[i].active && !bets[i].cashedOut) {
                    btn.className = 'bet-btn cashout';
                    btn.innerText = `Cash Out (${(bets[i].amount * currentMultiplier).toFixed(2)})`;
                    input.disabled = true;
                } else if (bets[i].cashedOut) {
                    btn.className = 'bet-btn cashed';
                    btn.innerText = 'Cashed Out';
                    input.disabled = false;
                } else {
                    btn.className = 'bet-btn';
                    btn.innerText = `Bet ${val.toFixed(2)} ETB`;
                    input.disabled = false;
                }
            } else if (gameState === 'CRASHED') {
                btn.className = 'bet-btn';
                btn.innerText = `Bet ${val.toFixed(2)} ETB`;
                input.disabled = false;
            }
        }
    }

    function applyServerPanels(activeBets = {}, queuedBets = {}) {
        for (let i = 1; i <= 2; i++) {
            const act = activeBets[i];
            const q = queuedBets[i];
            if (q) {
                bets[i].queued = true;
                bets[i].active = false;
                bets[i].cashedOut = false;
                bets[i].amount = Number(q.amount || bets[i].amount);
            } else if (act && act.status === 'PLACED') {
                bets[i].queued = false;
                bets[i].active = true;
                bets[i].cashedOut = false;
                bets[i].amount = Number(act.amount || bets[i].amount);
            } else if (act && act.status === 'CASHED_OUT') {
                bets[i].queued = false;
                bets[i].active = true;
                bets[i].cashedOut = true;
                bets[i].amount = Number(act.amount || bets[i].amount);
            } else {
                bets[i].queued = false;
                bets[i].active = false;
                bets[i].cashedOut = false;
            }
        }
        updateUI();
    }

    function formatBetInput(panelId) {
        const input = document.getElementById(`betInput${panelId}`);
        let val = parseFloat(input.value);
        if (isNaN(val) || val < 1) val = 10;
        if (val > 10000) val = 10000;
        input.value = val.toFixed(2);
        updateUI();
    }

    function adjustBet(panelId, delta) {
        if (bets[panelId].active || bets[panelId].queued) return;
        const input = document.getElementById(`betInput${panelId}`);
        let val = (parseFloat(input.value) || 20) + delta;
        if (val < 10) val = 10;
        input.value = val.toFixed(2);
        updateUI();
    }

    function setChip(panelId, val) {
        if (bets[panelId].active || bets[panelId].queued) return;
        document.getElementById(`betInput${panelId}`).value = val.toFixed(2);
        updateUI();
    }

    function addBonusBalance() {
        if (!socket || !socket.connected) return;
        socket.emit('balance:bonus', { playerId: identity.playerId, amount: 500 }, (res) => {
            if (res && res.ok) {
                balance = res.balance;
                updateUI();
                jetAudio.playCashout();
                showToast('+500.00 ETB Added!', true);
            }
        });
    }

    function syncAutoCollect(panelId) {
        const enabled = document.getElementById(`autoCollect${panelId}`).checked;
        const val = Math.max(1.01, parseFloat(document.getElementById(`autoCollectVal${panelId}`).value) || 2.0);
        if (socket && socket.connected) {
            socket.emit('panel:autocollect', {
                playerId: identity.playerId,
                panelId,
                autoCollect: enabled,
                autoCollectVal: val
            });
        }
    }

    function onAutoBetToggle(panelId) {
        const checked = document.getElementById(`autoBet${panelId}`).checked;
        if (checked && !bets[panelId].active && !bets[panelId].queued) {
            handleBet(panelId);
        }
    }

    function handleBet(panelId) {
        if (!socket || !socket.connected) {
            showToast('Connecting to JetX server...');
            return;
        }
        formatBetInput(panelId);
        const inputVal = parseFloat(document.getElementById(`betInput${panelId}`).value);
        const autoCollect = document.getElementById(`autoCollect${panelId}`).checked;
        const autoCollectVal = parseFloat(document.getElementById(`autoCollectVal${panelId}`).value) || 2.0;

        // 1. Cancel queued or waiting bet
        if (bets[panelId].queued || (gameState === 'WAITING' && bets[panelId].active)) {
            socket.emit('bet:cancel', { playerId: identity.playerId, panelId }, (res) => {
                if (!res || !res.ok) {
                    showToast(res?.error || 'Could not cancel');
                    return;
                }
                jetAudio.playCancel();
                if (typeof res.balance === 'number') balance = res.balance;
                if (Array.isArray(res.players)) livePlayers = res.players;
                applyServerPanels(res.activeBets, res.queuedBets);
                refreshOpenModal();
            });
            return;
        }

        // 2. Cash Out during flight
        if (gameState === 'FLYING' && bets[panelId].active && !bets[panelId].cashedOut) {
            socket.emit('bet:cashout', { playerId: identity.playerId, panelId }, (res) => {
                if (!res || !res.ok) {
                    showToast(res?.error || 'Too late! Jet crashed');
                }
            });
            return;
        }

        // 3. Place bet now (WAITING) or queue for next round (FLYING/CRASHED)
        socket.emit('bet:place', {
            playerId: identity.playerId,
            displayName: identity.displayName,
            panelId,
            amount: inputVal,
            autoCollect,
            autoCollectVal
        }, (res) => {
            if (!res || !res.ok) {
                showToast(res?.error || 'Bet failed');
                document.getElementById(`autoBet${panelId}`).checked = false;
                return;
            }
            jetAudio.playBet();
            if (typeof res.balance === 'number') balance = res.balance;
            if (Array.isArray(res.players)) livePlayers = res.players;
            applyServerPanels(res.activeBets, res.queuedBets);
            refreshOpenModal();
        });
    }

    // ==========================================
    // 5. JET GRAPHIC MOTION & SOCKET.IO SYNC
    // ==========================================
    function positionJetDuringFlight() {
        if (gameState !== 'FLYING') return;
        const elapsed = Math.max(0, (performance.now() - flightStartedAt) / 1000);
        const posX = Math.min(elapsed * 42, 260);
        const posY = Math.min(elapsed * 30, 145);
        document.getElementById('jetContainer').style.transform = `translate(${posX}px, -${posY}px) rotate(12deg)`;
        requestAnimationFrame(positionJetDuringFlight);
    }

    const socket = typeof io === 'function'
        ? io('/jetx', { auth: { playerId: identity.playerId, displayName: identity.displayName } })
        : null;

    if (socket) {
        socket.on('connect', () => {
            socket.emit('player:identify', identity);
        });

        socket.on('room:state', (snap) => {
            if (!snap) return;
            roundId = snap.roundId;
            gameState = snap.phase;
            currentMultiplier = Number(snap.multiplier || 1.00);
            if (Array.isArray(snap.history)) historyList = snap.history;
            if (Array.isArray(snap.players)) livePlayers = snap.players;
            if (Array.isArray(snap.chatMessages)) chatMessages = snap.chatMessages;
            if (snap.stats) serverStats = snap.stats;
            if (typeof snap.onlineCount === 'number') {
                document.getElementById('onlineCount').innerText = String(snap.onlineCount);
            }
            if (snap.player) {
                balance = Number(snap.player.balance ?? balance);
                applyServerPanels(snap.player.activeBets, snap.player.queuedBets);
            }

            const disp = document.getElementById('multiplierDisplay');
            const status = document.getElementById('statusMsg');
            const explosion = document.getElementById('explosionIcon');
            const jet = document.getElementById('jetContainer');

            if (gameState === 'WAITING') {
                disp.innerText = '1.00x';
                disp.classList.remove('crashed');
                explosion.style.display = 'none';
                jet.style.opacity = '1';
                jet.style.transform = 'translate(0px, 0px) rotate(0deg)';
                status.innerText = `Next round in ${(Number(snap.waitTimeLeft || 5000) / 1000).toFixed(1)}s`;
                jetAudio.stopFlight();
            } else if (gameState === 'FLYING') {
                flightStartedAt = performance.now() - (snap.flightElapsedMs || 0);
                disp.innerText = `${currentMultiplier.toFixed(2)}x`;
                disp.classList.remove('crashed');
                explosion.style.display = 'none';
                jet.style.opacity = '1';
                status.innerText = 'FLYING';
                positionJetDuringFlight();
                jetAudio.startFlight(currentMultiplier);
            } else if (gameState === 'CRASHED') {
                disp.innerText = `${currentMultiplier.toFixed(2)}x BOOM`;
                disp.classList.add('crashed');
                status.innerText = 'BOOM!';
                jet.style.opacity = '0';
                jetAudio.stopFlight();
            }

            updateHistoryBar();
            updateUI();
            refreshOpenModal();
        });

        socket.on('round:waiting', (data) => {
            gameState = 'WAITING';
            roundId = data.roundId;
            currentMultiplier = 1.00;
            if (Array.isArray(data.players)) livePlayers = data.players;

            const disp = document.getElementById('multiplierDisplay');
            disp.innerText = '1.00x';
            disp.classList.remove('crashed');
            document.getElementById('statusMsg').innerText = `Next round in ${(Number(data.waitTimeLeft || 5000) / 1000).toFixed(1)}s`;
            document.getElementById('explosionIcon').style.display = 'none';
            const jet = document.getElementById('jetContainer');
            jet.style.opacity = '1';
            jet.style.transform = 'translate(0px, 0px) rotate(0deg)';
            jetAudio.stopFlight();

            // Trigger client Auto Bet if checked & not already active/queued
            [1, 2].forEach((id) => {
                if (document.getElementById(`autoBet${id}`).checked && !bets[id].active && !bets[id].queued) {
                    handleBet(id);
                }
            });

            updateUI();
            refreshOpenModal();
        });

        socket.on('round:wait_tick', (data) => {
            if (data.roundId === roundId && gameState === 'WAITING') {
                document.getElementById('statusMsg').innerText = `Next round in ${(Number(data.waitTimeLeft) / 1000).toFixed(1)}s`;
            }
        });

        socket.on('round:launch', (data) => {
            gameState = 'FLYING';
            roundId = data.roundId;
            currentMultiplier = 1.00;
            flightStartedAt = performance.now();

            document.getElementById('statusMsg').innerText = 'FLYING';
            document.getElementById('multiplierDisplay').innerText = '1.00x';
            document.getElementById('multiplierDisplay').classList.remove('crashed');
            document.getElementById('explosionIcon').style.display = 'none';
            document.getElementById('jetContainer').style.opacity = '1';

            jetAudio.startFlight(1.00);
            positionJetDuringFlight();
            updateUI();
        });

        socket.on('round:tick', (data) => {
            if (data.roundId !== roundId || gameState !== 'FLYING') return;
            currentMultiplier = Number(data.multiplier || 1.00);
            document.getElementById('multiplierDisplay').innerText = currentMultiplier.toFixed(2) + 'x';
            jetAudio.updateFlight(currentMultiplier);
            if (Array.isArray(data.players)) {
                livePlayers = data.players;
                if (activeModalTab === 'players') refreshOpenModal();
            }
            updateUI();
        });

        socket.on('round:crashed', (data) => {
            gameState = 'CRASHED';
            currentMultiplier = Number(data.crashPoint || currentMultiplier);

            document.getElementById('statusMsg').innerText = 'BOOM!';
            const disp = document.getElementById('multiplierDisplay');
            disp.innerText = currentMultiplier.toFixed(2) + 'x BOOM';
            disp.classList.add('crashed');

            const elapsed = Math.max(0, (performance.now() - flightStartedAt) / 1000);
            const posX = Math.min(elapsed * 42, 260);
            const posY = Math.min(elapsed * 30, 145);
            const exp = document.getElementById('explosionIcon');
            exp.style.left = (20 + posX) + 'px';
            exp.style.bottom = (40 + posY) + 'px';
            exp.style.display = 'block';
            document.getElementById('jetContainer').style.opacity = '0';

            jetAudio.playExplosion();

            if (Array.isArray(data.history)) {
                historyList = data.history;
                updateHistoryBar();
            }
            if (data.stats) serverStats = data.stats;
            if (Array.isArray(data.players)) livePlayers = data.players;

            for (let i = 1; i <= 2; i++) {
                bets[i].active = false;
                bets[i].cashedOut = false;
            }
            updateUI();
            refreshOpenModal();
        });

        socket.on('bet:cashed_out', (data) => {
            if (typeof data.balance === 'number') balance = data.balance;
            applyServerPanels(data.activeBets || {}, {});
            jetAudio.playCashout();
            showToast(`Cashed Out +${Number(data.winAmount).toFixed(2)} ETB (${Number(data.mult).toFixed(2)}x)`, true);
            refreshOpenModal();
        });

        socket.on('player:sync', (data) => {
            if (typeof data.balance === 'number') balance = data.balance;
            if (data.activeBets || data.queuedBets) {
                applyServerPanels(data.activeBets || {}, data.queuedBets || {});
            } else {
                updateUI();
            }
        });

        socket.on('players:update', (data) => {
            if (Array.isArray(data.players)) {
                livePlayers = data.players;
                if (activeModalTab === 'players') refreshOpenModal();
            }
        });

        socket.on('chat:message', (msg) => {
            chatMessages.push(msg);
            if (chatMessages.length > 60) chatMessages.shift();
            if (activeModalTab === 'chat') renderChatMessages();
        });
    }

    // Initialize UI icon
    (function initAudioIcon() {
        const btn = document.getElementById('audioToggleBtn');
        btn.textContent = jetAudio.enabled ? '🔊' : '🔇';
        btn.className = jetAudio.enabled ? 'audio-btn' : 'audio-btn muted';
        updateHistoryBar();
        updateUI();
    })();
</script>
</body>
</html>
