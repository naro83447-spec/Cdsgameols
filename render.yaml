services:
  - type: web
    name: lite-games-platform
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: Gamesporo18
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_ADMIN_UIDS
        sync: false
      - key: MIN_DEPOSIT_ETB
        value: '10'
      - key: MAX_DEPOSIT_ETB
        value: '100000'
      - key: TELEBIRR_ACCOUNT_NAME
        sync: false
      - key: TELEBIRR_ACCOUNT_NUMBER
        sync: false
      - key: TELEBIRR_DEPOSIT_INSTRUCTIONS
        sync: false

  - type: worker
    name: lite-games-telegram-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:bot
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
