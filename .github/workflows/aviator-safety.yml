name: Aviator safety tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [aviator-real-money-hardening-plan]

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run test:aviator:safety
